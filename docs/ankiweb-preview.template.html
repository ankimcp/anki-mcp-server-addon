<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnkiWeb description preview</title>
<style>
  body {
    max-width: 820px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #1a1a1a;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  img  { max-width: 100%; height: auto; }
  h2   { margin-top: 1.6em; font-size: 1.25rem; }
  pre  { background: #f5f5f5; padding: .75rem; border-radius: 6px; overflow-x: auto; }
  small { color: #666; }

  /* Mock-up of the listing title, which lives in AnkiWeb's Title field
     rather than in the description itself. Keep it in sync by hand. */
  .listing-title {
    background: #eee;
    border-left: 3px solid #999;
    padding: .5rem .75rem;
    margin-bottom: 1.5rem;
    font-size: .9rem;
  }

  /* Mock-up of the "Description" heading AnkiWeb's page itself renders
     above the description area — it is site chrome, not our content. */
  .page-chrome-heading {
    font-size: 1.75rem;
    font-weight: 600;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>

<div class="listing-title">
  <b>Listing title:</b> Anki MCP Server (ankimcp.ai) &ndash; Connect Claude, ChatGPT &amp; AI to Anki
</div>

<div class="page-chrome-heading">Description</div>

<!-- DESCRIPTION -->

</body>
</html>
